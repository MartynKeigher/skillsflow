[project]
name = "skillsflow"
version = "0.2.0"
description = "Builds the SkillsHub catalog of Claude Skills and Claude Code plugins"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
skillsflow = "skillsflow.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["skillsflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
